name: ai_cat_mobile
description: "AI Kedi Asistani - Gemini destekli, uygulama ekraninda gezinen mobil kedi asistani."
publish_to: 'none'
version: 1.7.0+22

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.7
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  crypto: ^3.0.3
  cryptography: ^2.9.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  receive_sharing_intent: ^1.9.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  home_widget: ^0.9.4
  mobile_scanner: ^7.4.1
  flutter_overlay_window: ^0.5.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/cat/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#14141C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
