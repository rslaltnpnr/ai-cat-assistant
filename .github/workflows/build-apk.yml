name: Build Android APK (AI Kedi Asistani)

on:
  push:
    branches: [main]
    paths:
      - 'ai_cat_mobile/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai_cat_mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_cat_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bagimliliklari kur
        run: flutter pub get

      - name: Analiz et
        run: flutter analyze

      - name: Testleri calistir
        run: flutter test

      - name: APK derle
        run: flutter build apk --release

      - name: APK'yi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: ai-kedi-asistani-apk
          path: ai_cat_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
