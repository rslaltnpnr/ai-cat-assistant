name: Build and Release Desktop App (AI Kedi Asistani)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Surum etiketi (orn. v1.1.0) - tag olmadan elle tetiklerken gerekli'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai_desktop_assistant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          # PyAudio bilerek requirements.txt'te degil (Linux'taki test CI'i
          # PortAudio basliklari olmadan derlemeye calisip patlardi - bkz.
          # requirements.txt'teki not). Burada, sadece Windows derlemesinde,
          # PyPI'nin hazir wheel'iyle sorunsuz kurulur.
          pip install pyaudio

      - name: Modulu derle (syntax kontrolu)
        run: python -m py_compile main.py

      - name: .exe olarak derle (PyInstaller)
        # pyttsx3, isletim sistemine gore konusma motorunu (Windows'ta
        # sapi5) importlib.import_module ile calisma zamaninda, string'den
        # yukler - PyInstaller'in statik analizi bunu goremez, bu yuzden
        # --hidden-import ile acikca belirtilmezse derlenmis .exe'de
        # "sesli yanit" ozelligi calisma zamaninda "bilinmeyen surucu"
        # hatasi verir (bkz. main.py TextToSpeechWorker).
        run: >
          pyinstaller --onefile --windowed --name "AI-Kedi-Asistani"
          --hidden-import "pyttsx3.drivers"
          --hidden-import "pyttsx3.drivers.sapi5"
          --add-data "assets;assets" main.py

      # WINDOWS_CODESIGN_PFX_BASE64 secret'i tanimli degilse bu adim
      # atlanir ve .exe imzasiz kalir (build kirilmaz). Kod imzalamak,
      # Windows'un "Bilinmeyen Yayimci" uyarisini "AI Kedi Asistani"
      # yayimcisiyla degistirir; Windows SmartScreen/antivirus itibar
      # uyarilarini KALDIRMAZ - bunun icin guvenilir bir CA'dan (ucretli
      # ya da acik kaynak projeler icin bazen ucretsiz) gercek bir imzalama
      # sertifikasi gerekir. Bkz. README.
      - name: .exe'yi imzala (sertifika varsa)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_BASE64)) {
            Write-Host "WINDOWS_CODESIGN_PFX_BASE64 tanimli degil, imzalama atlaniyor."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes("codesign.pfx", $bytes)

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Error "signtool.exe bulunamadi (Windows SDK)"
            exit 1
          }
          & $signtool.FullName sign /f codesign.pfx /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "dist\AI-Kedi-Asistani.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Kod imzalama sertifikasini temizle
        if: always()
        shell: pwsh
        run: Remove-Item -Path codesign.pfx -ErrorAction SilentlyContinue

      - name: SHA-256 checksum uret
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path "dist\AI-Kedi-Asistani.exe" -Algorithm SHA256
          Set-Content -Path "dist\AI-Kedi-Asistani.exe.sha256" -Value $hash.Hash -Encoding ascii -NoNewline

      - name: GitHub Release olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            ai_desktop_assistant/dist/AI-Kedi-Asistani.exe
            ai_desktop_assistant/dist/AI-Kedi-Asistani.exe.sha256
          generate_release_notes: true
